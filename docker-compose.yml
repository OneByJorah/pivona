# =============================================================================
# pivona — docker-compose.yml
# =============================================================================
# Quick local demo (no NET_ADMIN needed):
#   cp .env.example .env
#   docker compose up -d --build
#   curl http://127.0.0.1:5000/healthz
#
# For a real router deployment, see the NET_ADMIN notes in README.md.
# =============================================================================

services:
  pivona:
    image: ghcr.io/onebyjorah/pivona:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pivona
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-5000}:5000"
    volumes:
      - pivona_data:/var/lib/pivona
    env_file:
      - .env.example
    networks:
      - pivona_net

volumes:
  pivona_data:
    driver: local

networks:
  pivona_net:
    driver: bridge
